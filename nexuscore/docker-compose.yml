# Production stack: Caddy (HTTPS) -> web + API -> MySQL.
# Copy deploy.env.example to .env and replace every placeholder before deployment.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nexuscore
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [internal]

  migrate:
    image: mysql:8.4
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: nexuscore
      ACCOUNT_HOST: 172.28.0.%
      NEXUSCORE_APP_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      NEXUSCORE_MIGRATOR_PASSWORD: ${NEXUSCORE_MIGRATOR_PASSWORD:?Set NEXUSCORE_MIGRATOR_PASSWORD in .env}
    volumes:
      - ./database:/database:ro
    command: ["bash", "-lc", "bash /database/provision-users.sh && bash /database/migrate.sh"]
    networks: [internal]

  migrate:
    image: mysql:8.4
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: nexuscore
      ACCOUNT_HOST: 172.28.0.%
      NEXUSCORE_APP_PASSWORD: ${DB_PASSWORD}
      NEXUSCORE_MIGRATOR_PASSWORD: ${NEXUSCORE_MIGRATOR_PASSWORD}
    volumes:
      - ./database:/database:ro
    command: ["bash", "-lc", "/database/provision-users.sh && /database/migrate.sh"]
    networks: [internal]

  api:
    image: ${DOCKERHUB_USERNAME:-local}/nexuscore-api:${TAG:-latest}
    build:
      context: ./NexusCore.Api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: nexuscore
      DB_USER: nexuscore_app
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PUBLIC_WEB_URL: https://${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
      PUBLIC_API_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env}/api
      HTTPS_MODE: "1"
      TRUSTED_PROXIES: 172.28.0.10
    volumes:
      - uploads:/app/uploads
    networks: [internal]

  web:
    image: ${DOCKERHUB_USERNAME:-local}/nexuscore-web:${TAG:-latest}
    build:
      context: ./client
      args:
        VITE_API_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env}/api
        VITE_HUB_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env}/hubs/chat
        VITE_PUBLIC_API_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env}/api
        VITE_PUBLIC_WEB_URL: https://${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: 172.28.0.10

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  mysql_data:
  uploads:
  caddy_data:
  caddy_config:
