services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [nexuscore]

  migrate:
    image: mysql:8.4
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: nexuscore
      ACCOUNT_HOST: 172.30.0.%
      NEXUSCORE_APP_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      NEXUSCORE_MIGRATOR_PASSWORD: ${NEXUSCORE_MIGRATOR_PASSWORD:?Set NEXUSCORE_MIGRATOR_PASSWORD in .env}
    volumes:
      - ./nexuscore/database:/database:ro
    command: ["bash", "-lc", "bash /database/provision-users.sh && bash /database/migrate.sh"]
    networks: [nexuscore]

  api:
    image: ${DOCKERHUB_USERNAME:-local}/nexuscore-api:${TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: nexuscore
      DB_USER: nexuscore_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSL_MODE: Required
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PUBLIC_WEB_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/uploads
    networks: [nexuscore]

  web:
    image: ${DOCKERHUB_USERNAME:-local}/nexuscore-web:${TAG:-dev}
    build:
      context: ./nexuscore/client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_HUB_URL: http://localhost:8080/hubs/chat
        VITE_PUBLIC_API_URL: http://localhost:8080/api
        VITE_PUBLIC_WEB_URL: http://localhost:3000
    depends_on: [api]
    ports:
      - "127.0.0.1:3000:80"
    networks: [nexuscore]

networks:
  nexuscore:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  mysql_data:
  uploads:
